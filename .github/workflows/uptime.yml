name: uptime
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: uptime
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check endpoints
        id: check
        run: |
          down=""
          check() { # name url expected-substring
            for i in 1 2 3; do
              body=$(curl -s -m 20 "$2" || true)
              if printf '%s' "$body" | grep -q "$3"; then echo "ok  $1"; return 0; fi
              sleep 20
            done
            echo "DOWN $1"; down="$down $1"
          }
          check CrocoAI https://crocoai.perpetuummobile.tech/api/health '"ok":true'
          echo "down=$down" >> "$GITHUB_OUTPUT"
      - name: Previous run state
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh api "repos/${{ github.repository }}/actions/workflows/uptime.yml/runs?status=completed&per_page=1" -q '.workflow_runs[0].conclusion' || echo "")
          echo "prev=${prev:-success}" >> "$GITHUB_OUTPUT"
      - name: Telegram on state change
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          DOWN: ${{ steps.check.outputs.down }}
          PREV: ${{ steps.prev.outputs.prev }}
        run: |
          send() { curl -s -m 15 -o /dev/null "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" -d chat_id="$TG_CHAT" --data-urlencode text="$1"; }
          if [ -n "$DOWN" ] && [ "$PREV" = "success" ]; then send "🔴 Monitor extern (GitHub): nu răspunde:$DOWN — Junioru sau tunelul Cloudflare poate fi căzut."; fi
          if [ -z "$DOWN" ] && [ "$PREV" = "failure" ]; then send "🟢 Monitor extern (GitHub): CrocoAI a revenit."; fi
      - name: Keep schedule alive (monthly commit)
        if: ${{ github.event.schedule && steps.check.outputs.down == '' }}
        run: |
          if [ "$(date -u +%d)" = "01" ] && [ "$(date -u +%H)" = "00" ] && [ "$(date -u +%M | cut -c1)" = "0" ]; then
            git clone -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" r && cd r
            date -u > .keepalive && git -c user.name=uptime-bot -c user.email=uptime@users.noreply.github.com commit -qam "keepalive" && git push -q
          fi
      - name: Fail when down
        if: ${{ steps.check.outputs.down != '' }}
        run: exit 1
