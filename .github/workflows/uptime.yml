name: uptime
# GitHub throttles schedules on low-activity repos (runs every 2-5 h), so each run loops for ~5h45m,
# checking every 5 minutes; the next scheduled run waits in the concurrency queue and starts right after.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: uptime
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Watch (every 5 min, ~5h45m)
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name uptime-bot; git config user.email uptime@users.noreply.github.com
          send() { curl -s -m 15 -o /dev/null "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" -d chat_id="$TG_CHAT" --data-urlencode text="$1"; }
          check() { for i in 1 2 3; do curl -s -m 20 "$2" | grep -q "$3" && return 0; sleep 20; done; return 1; }
          END=$(( $(date +%s) + 345*60 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            git pull -q --rebase || true
            PREV=$(cat state 2>/dev/null || echo up)
            if check CrocoAI https://crocoai.perpetuummobile.tech/api/health '"ok":true'; then NOW=up; else NOW=down; fi
            echo "$(date -u +%FT%TZ) $NOW"
            if [ "$NOW" != "$PREV" ]; then
              if [ "$NOW" = down ]; then send "🔴 Monitor extern (GitHub): CrocoAI nu răspunde — Junioru sau tunelul Cloudflare poate fi căzut."; else send "🟢 Monitor extern (GitHub): CrocoAI a revenit."; fi
              echo "$NOW" > state; git add state; git commit -qm "state: $NOW" && git push -q || true
            fi
            sleep 300
          done
